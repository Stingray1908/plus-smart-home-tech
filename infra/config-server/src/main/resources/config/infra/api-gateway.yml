spring:
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:3000
              - http://localhost:5173
              - http://localhost:8443
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - '*'
            exposed-headers:
              - Location
            allow-credentials: true
            max-age: 3600
      discovery:
        locator:
          enabled: false

      routes:
        # Readers
        - id: SHOPPING-STORE-Reader
          uri: lb://shopping-store
          predicates:
            - Path=/api/v1/shopping-store/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: SHOPPING-CART-Reader
          uri: lb://shopping-cart
          predicates:
            - Path=/api/v1/shopping-cart/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: WAREHOUSE-Reader
          uri: lb://warehouse
          predicates:
            - Path=/api/v1/warehouse/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: ORDER-Reader
          uri: lb://order
          predicates:
            - Path=/api/v1/order/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        # Personal
        - id: SHOPPING-STORE
          uri: lb://shopping-store
          predicates:
            - Path=/api/v1/shopping-store/**

        - id: SHOPPING-CART
          uri: lb://shopping-cart
          predicates:
            - Path=/api/v1/shopping-cart/**

        - id: WAREHOUSE
          uri: lb://warehouse
          predicates:
            - Path=/api/v1/warehouse/**

        - id: DELIVERY
          uri: lb://delivery
          predicates:
            - Path=/api/v1/delivery/**

        - id: ORDER
          uri: lb://order
          predicates:
            - Path=/api/v1/order/**

        - id: PAYMENT
          uri: lb://payment
          predicates:
            - Path=/api/v1/payment/**


        # Common
        #- id: SHOPPING-CART-WAREHOUSE
         # uri: lb://shopping-cart
          #predicates:
           # - Path=/api/v1/shopping-cart/**



