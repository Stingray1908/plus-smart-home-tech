logging:
  level:
    org.springframework.boot.context.properties: DEBUG

spring:
  application:
    name: aggregator
  config:
    import: "configserver:"
    cloud:
      config:
        discovery:
          enabled: true
          serviceId: config-server

server:
  port: 8081

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
