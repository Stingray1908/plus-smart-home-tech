logging:
  level:
    org.springframework.boot.context.properties: DEBUG

spring:
  application:
    name: aggregator
  config:
    import: "optional:configserver:"   # <--- ЭТО ОБЯЗАТЕЛЬНОЕ СВОЙСТВО
  cloud:
    config:
      discovery:
        enabled: true                  # <-- теперь это сработает, потому что import уже есть
        service-id: config-server

server:
  port: 0

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
