
syntax = "proto3";

import "telemetry/messages/hub_event.proto";
import "google/protobuf/empty.proto";

package telemetry.services.collector;

option java_multiple_files = true;
option java_package = "ru.yandex.practicum.grpc.telemetry.collector";

service CollectorController {
rpc SendEvent (telemetry.messages.event.HubEventProto) returns (google.protobuf.Empty);
rpc GetStatus (google.protobuf.Empty) returns (google.protobuf.Empty);
}
