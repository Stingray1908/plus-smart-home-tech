spring:
  jpa:
    hibernate:
      ddl-auto: none
  datasource:
    url: jdbc:postgresql://localhost:5432/smart_home_db
    username: postgres
    password: password
  sql:
    init:
      mode: always
      schema: classpath:schema.sql
      continue-on-error: false

server:
  port: 8082

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

kafka:
  bootstrap-servers: "localhost:9092"
  producer:
    key-serializer: "org.apache.kafka.common.serialization.StringSerializer"
    value-serializer: "ru.yandex.practicum.config.SensorEventAvroSerializer"  # замени на свой реальный класс Avro-сериализатора
    acks: "all"
    retries: 3
    batch-size: 16384
  consumer:
    max-poll-interval-ms: 300000
    session-timeout-ms: 45000
    enable-auto-commit: false

logging:
  level:
    ru:
      yandex:
        practicum: DEBUG
