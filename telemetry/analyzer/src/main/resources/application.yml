spring:
  jpa:
    hibernate:
      ddl-auto: none          # отключаем автогенерацию схемы, чтобы не ломать руками созданное
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://localhost:5432/smart_home_db
    username: postgres
    password: password
  sql:
    init:
      mode: always            # всегда выполнять schema.sql при старте
      schema: classpath:schema.sql
      continue-on-error: false
server:
  port: 8082

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext
