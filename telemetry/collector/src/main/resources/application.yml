spring:
  application:
    name: smart-home-collector

kafka:
  bootstrap-servers: localhost:9092
  topic:
    hubEvents: telemetry.hubs.v1
    sensorEvents: telemetry.sensors.v1
  producer:
    acks: 1
    retries: 3
    batchSize: 16384
    keySerializer: org.apache.kafka.common.serialization.StringSerializer
    valueSerializer: ru.yandex.practicum.config.EventAvroSerializer

grpc:
  server:
    port: 59091
