services:

  shop_db:
    image: postgres:15-alpine
    container_name: shopping_store_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shop_db
    ports:
      - "5432:5432"
      # volumes:
      # - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop_db"]
      interval: 2s
      timeout: 5s
      retries: 30

  shop_app:
    build:
      context: /shopping-store
      dockerfile: Dockerfile
    container_name: shopping_store_app
    depends_on:
      shop_db:
        condition: service_healthy
    environment:
      # Передаем настройки БД прямо сюда. Они перезапишут всё, что в application.yml
      SPRING_DATASOURCE_URL: jdbc:postgresql://shop_db:5432/shop_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Если у тебя есть Config Server, раскомментируй и укажи адрес:
      # SPRING_CLOUD_CONFIG_URI: http://config-server:8888

      # Для отладки
      SPRING_PROFILES_ACTIVE: docker

    ports:
      - "8080:8080"
    # volumes:
      # - ./target:/app/target

  # volumes:
  # pgdata:

  cart_db:
    image: postgres:15-alpine
    container_name: shopping_cart_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cart_db
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "5433:5432"   # <-- теперь можно подключиться с хоста на порт 5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cart_db"]
      interval: 2s
      timeout: 5s
      retries: 30
        # volumes:
      # - cart_pgdata:/var/lib/postgresql/data

  cart_app:
    build:
      context: ./shopping-cart
      dockerfile: Dockerfile
    container_name: shopping_cart_app
    depends_on:
      cart_db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://cart_db:5432/cart_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8080"

# volumes:
  # cart_pgdata:
