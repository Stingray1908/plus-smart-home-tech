spring:
  application:
    name: warehouse
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
  jpa:
    hibernate:
      ddl-auto: update  # Автоматически создаст таблицу products при первом запуске
    show-sql: true       # Видеть SQL запросы в логах (удобно для отладки)
  datasource:
    # Эти значения будут ПЕРЕЗАПИСАНЫ переменными окружения из docker-compose.yml
    url: jdbc:postgresql://localhost:5434/warehouse_db
    username: postgres
    password: password

logging:
  level:
    org.hibernate.SQL: DEBUG
    ru.yandex.practicum: DEBUG

server:
  port: 0

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
