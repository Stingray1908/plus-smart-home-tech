spring:
  application:
    name: warehouse
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  datasource:
    url: jdbc:postgresql://localhost:5434/warehouse_db
    username: postgres
    password: password

logging:
  level:
    org.hibernate.SQL: DEBUG
    ru.yandex.practicum: DEBUG

server:
  port: 0

eureka:
  instance:
    prefer-ip-address: true
    hostname: localhost
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
